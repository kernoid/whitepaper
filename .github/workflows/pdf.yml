# Sets the whitepaper again (Markdown → Typst → PDF with template/), checks that the committed .typ is current,
# attaches the PDF to the run and, for a tag v*, to a GitHub release.
name: PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the footer shows each document's last commit date
      - uses: pandoc/actions/setup@v1
        with:
          version: 3.7.0.2
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Build
        run: ./build.sh
      - name: Committed .typ files are current
        run: git diff --exit-code -- '*.typ'
      - uses: actions/upload-artifact@v7
        with:
          name: kernoid-whitepaper
          path: '*.pdf'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kernoid-whitepaper
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" whitepaper.pdf --repo "$GITHUB_REPOSITORY" --title "Whitepaper $GITHUB_REF_NAME"
