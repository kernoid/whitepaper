# SPDX-License-Identifier: CC-BY-4.0
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). The build tooling names its own
# licence (AGPL-3.0-or-later) in an SPDX header.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"

# The text: the whitepaper's Markdown, the Typst and PDF set from it, this repository's other texts.
[[annotations]]
path = ["**/*.md", "*.typ", "*.pdf", "**/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# A copy of the artwork from kernoid/brand – kept as it is, under its licence.
[[annotations]]
path = "template/assets/**"
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

[[annotations]]
path = "template/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright © 2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

# The pandoc template: no header of its own – its lines go into every generated .typ.
[[annotations]]
path = "template/pandoc.typ"
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
